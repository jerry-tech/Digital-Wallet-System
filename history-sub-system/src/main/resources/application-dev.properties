spring.application.name=history-sub-system
server.port=${SERVER_PORT}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=history-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

kafka.topics.wallet-creation-topic=${KAFKA_WALLET_CREATION_TOPIC:wallet.creation.event.0}
kafka.topics.wallet-funding-topic=${KAFKA_WALLET_FUNDING_TOPIC:wallet.funding.event.0}
kafka.topics.wallet-transfer-topic=${KAFKA_WALLET_TRANSFER_TOPIC:wallet.transfer.event.0}