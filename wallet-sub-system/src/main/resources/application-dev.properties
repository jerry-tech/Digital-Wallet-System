spring.application.name=wallet-sub-system
server.port=${SERVER_PORT}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#kafka
kafka.topics.wallet-creation-topic=${KAFKA_WALLET_CREATION_TOPIC:wallet.creation.event.0}
kafka.topics.wallet-funding-topic=${KAFKA_WALLET_FUNDING_TOPIC:wallet.funding.event.0}
kafka.topics.wallet-transfer-topic=${KAFKA_WALLET_TRANSFER_TOPIC:wallet.transfer.event.0}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}

wallet.funding.max-attempts=${WALLET_FUNDING_MAX_ATTEMPTS:5}
